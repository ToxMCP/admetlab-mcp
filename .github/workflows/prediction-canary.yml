name: Technical prediction canary

# One synthetic ethanol request, once weekly or manually. No PR/push live calls.
on:
  schedule:
    - cron: "43 5 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: technical-prediction-canary
  cancel-in-progress: true

jobs:
  prediction-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install locked runtime
        run: uv sync --locked --no-dev
      - name: One bounded technical prediction check
        # The script fixes retries=0, rps=1, no API key and a 20-second total timeout.
        run: uv run --no-sync python -m admetlab_mcp.canary | tee prediction-canary.json
      - name: Save technical status only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: technical-prediction-status
          path: prediction-canary.json
          if-no-files-found: ignore
