[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "admetlab-mcp"
version = "0.1.0"
description = "Model Context Protocol server for ADMETlab 3.0"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "ADMETlab MCP Team"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.29,<0.31",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "anyio>=4,<5",
  "coverage[toml]>=7.5,<8.0",
  "black>=26.3.1,<27.0",
  "isort>=5.13,<6.0",
]

[project.urls]
Homepage = "https://github.com/ToxMCP/admetlab-mcp"
Repository = "https://github.com/ToxMCP/admetlab-mcp"
Issues = "https://github.com/ToxMCP/admetlab-mcp/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
