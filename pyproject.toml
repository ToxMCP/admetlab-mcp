[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ADMETlab_MCP"
version = "0.1.0"
description = "Model Context Protocol server for ADMETlab 3.0"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "ADMETlab MCP Team"}
]
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.29,<0.31",
  "websockets>=11,<13",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<0.24",
  "anyio>=4,<5",
  "coverage[toml]>=7.5,<8.0",
  "black>=24.4,<25.0",
  "isort>=5.13,<6.0",
]

[project.urls]
Repository = "https://github.com/example/ADMETlab_MCP"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
